[package]
name = "maverick-proxy"
description = "The trial proxy binary. No database, its own deployment. Executes a chain using only the caller's credentials."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "maverick-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
maverick-core = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
# `RawValue`: the per-attempt body rewrite keeps every value's raw bytes.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
# The server runs on hyper directly (not `axum::serve`) for the 10 s header-read timeout.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "service", "tokio", "http1"] }
# D38 body cap: `Limited` reports a size overrun apart from a read error.
http-body-util = "0.1"

[dev-dependencies]
parity-support = { path = "../parity-support" }
test-support = { path = "../test-support" }
# A paused clock for the D26 `Retry-After` scenario.
tokio = { workspace = true, features = ["test-util"] }
