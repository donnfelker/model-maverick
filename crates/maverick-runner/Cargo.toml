[package]
name = "maverick-runner"
description = "The measurement runner: drives tasks through providers and graders. Depends on domain and providers only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
maverick-domain = { workspace = true }
maverick-providers = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
parity-support = { path = "../parity-support" }
# Paused tokio time keeps the pacing and concurrency tests exact and fast.
tokio = { workspace = true, features = ["test-util"] }
# The two batch persistence tests write through the real store to real Postgres.
maverick-store = { workspace = true }
maverick-testdb = { workspace = true }
sqlx = { workspace = true }
