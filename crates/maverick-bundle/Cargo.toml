[package]
name = "maverick-bundle"
description = "Signed public matrix bundle format, deterministic archives, and verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Fixed test key pairs (`trust::test_keys`) for bundle tests in other crates. Enable it only
# as a dev-dependency feature: a release build never trusts a test key.
test-keys = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { workspace = true }
tar = { workspace = true }

[dev-dependencies]
# The integration tests (the format fixtures) use `trust::test_keys`.
maverick-bundle = { path = ".", features = ["test-keys"] }
