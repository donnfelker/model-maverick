[workspace]
resolver = "3"
members = [
    "crates/acceptance",
    "crates/e2e",
    "crates/instrument-lint",
    "crates/maverick",
    "crates/maverick-alerts",
    "crates/maverick-bundle",
    "crates/maverick-api",
    "crates/maverick-config",
    "crates/maverick-core",
    "crates/maverick-domain",
    "crates/maverick-jobs",
    "crates/maverick-providers",
    "crates/maverick-proxy",
    "crates/maverick-runner",
    "crates/maverick-store",
    "crates/maverick-testdb",
    "crates/parity-support",
    "crates/sdk-conformance",
    "crates/test-support",
]

# Shared package metadata. Each crate sets `[package] ... .workspace = true` to inherit.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
authors = ["Model Maverick"]
repository = "https://github.com/modelmaverick/modelmaverick"

# Whole-stack version table (AGENTS.md bead pkg1.1 "Stack pins").
# Members reference these with `dep = { workspace = true }`. TLS is rustls only: no
# OpenSSL anywhere (cargo deny enforces this in CI; `cargo tree -i openssl-sys` must be empty).
[workspace.dependencies]
# --- async runtime, web, middleware ---
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
    "net",
    "io-util",
    "io-std",
    "fs",
    "process",
] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "timeout", "limit", "request-id"] }
axum = "0.8"

# --- HTTP client: rustls only, no default features (kills the native-tls/OpenSSL path) ---
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "http2",
    "charset",
] }

# --- Postgres store and the job queue (both on rustls) ---
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "json",
    "chrono",
    "uuid",
    "rust_decimal",
] }
# graphile_worker: pin the minor (plan §6: own a fork if it stalls). sqlx driver, rustls.
graphile_worker = { version = "0.13.5", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "driver-sqlx",
] }
# Its migration list, so the engine can tell pending queue migrations (spec §14.5, D50).
# Same version and features as graphile_worker's own dependency on it.
graphile_worker_migrations = { version = "0.4.21", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "driver-sqlx",
] }

# --- serialization and schema ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained serde YAML fork; the original serde_yaml is archived (AGENTS.md / bead).
serde_norway = "0.9"
# No default features: no remote or file $ref loading (Go loads none), and no HTTP
# client in the pure domain crate.
jsonschema = { version = "0.58", default-features = false }
# Go RE2 semantics come from graders::goregex (ASCII \d \w \s \b, anchoring).
regex = "1.13"
# Go unicode.IsLetter and script tables, for rule_scan's language detector.
unicode-general-category = "1.1"
unicode-script = "0.5"

# --- MCP ---
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }

# --- telemetry ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
# The OTLP exporter uses the async reqwest client, so its batch span processor and
# periodic metric reader must run on Tokio, not on the SDK's own threads.
opentelemetry_sdk = { version = "0.33", features = [
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
    "experimental_logs_batch_log_processor_with_async_runtime",
] }
# OTLP over HTTP with the reqwest+rustls client (no tonic, no OpenSSL). `logs` carries
# the proxy's `maverick.recommendation` record (D31).
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "reqwest-rustls",
    "trace",
    "metrics",
    "logs",
] }

# --- TLS for the SMTP STARTTLS alert channel (same rustls stack as reqwest; aws-lc-rs
# is named explicitly because ring is also compiled in via testcontainers) ---
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"

# --- crypto (RustCrypto) ---
hmac = "0.13"
sha2 = "0.11"
hkdf = "0.13"
aes-gcm = "0.11"
subtle = "2.6"
rand = "0.10"
ed25519-dalek = { version = "3", features = ["pem"] }
tar = "0.4"

# --- ids, time, errors ---
ulid = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
anyhow = "1"
# numeric(12,6) money columns (reference Part 1 §4: arbitrary precision, never f64 in SQL).
rust_decimal = "1"

# --- test-only ---
testcontainers = "0.28"
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"

# --- internal crates (path deps, referenced with { workspace = true }) ---
maverick-domain = { path = "crates/maverick-domain" }
maverick-bundle = { path = "crates/maverick-bundle" }
maverick-config = { path = "crates/maverick-config" }
maverick-store = { path = "crates/maverick-store" }
maverick-providers = { path = "crates/maverick-providers" }
maverick-runner = { path = "crates/maverick-runner" }
maverick-jobs = { path = "crates/maverick-jobs" }
maverick-alerts = { path = "crates/maverick-alerts" }
maverick-api = { path = "crates/maverick-api" }
maverick-core = { path = "crates/maverick-core" }
# Dev-only: real Postgres for store and job tests (testcontainers, template per schema).
maverick-testdb = { path = "crates/maverick-testdb" }

# Lints inherited by every crate via `[lints] workspace = true`.
# unsafe is forbidden by default; a crate that truly needs it overrides this locally.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# CI runs `clippy -- -D warnings`; keep the table for later shared allow/deny rules.

# Faster incremental release builds for the deploy image are configured in the plan's
# deployment section; keep root profiles at cargo defaults for now.
