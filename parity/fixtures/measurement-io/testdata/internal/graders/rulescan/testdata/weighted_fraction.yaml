description: score is the weighted fraction of rules satisfied
spec:
  rules:
    - { must_include: WHERE, weight: 2 }
    - { must_include: ORDER BY, weight: 1 }
    - { must_not_include: DROP TABLE, weight: 1 }
output: SELECT * FROM users WHERE id = 1;
expect:
  dimensions: { constraint_compliance: 0.75 }
  detail_contains: ['"score":0.75', '"critical_failed":false']
