[package]
name = "maverick-providers"
description = "Hand-written typed provider clients (Anthropic, OpenAI, Google; xAI via the OpenAI client), the deterministic fake provider, and retry. reqwest on rustls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# A listed model's `created_at` (spec §4.6).
chrono = { workspace = true }
maverick-domain = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
# `raw_value` keeps a forced tool's `input` bytes (Go compacts them as sent).
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
parity-support = { path = "../parity-support" }
tokio = { workspace = true }
