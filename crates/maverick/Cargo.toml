[package]
name = "maverick"
description = "The engine binary and CLI entry point. Wires the crates and runs the subcommands: serve, migrate, corpus, mcp-stdio, demo-run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

# The library holds `run` so tests drive the CLI without a process. It is named
# `maverick_cli` so its output does not collide with the `maverick` binary.
[lib]
name = "maverick_cli"
path = "src/lib.rs"

[[bin]]
name = "maverick"
path = "src/main.rs"

[lints]
workspace = true

# Used only by the sealed test harness, never from a normal dependency.
# Release binaries always use real trust keys.
[features]
test-keys = ["maverick-bundle/test-keys"]

[dependencies]
maverick-bundle = { workspace = true }
maverick-domain = { workspace = true }
maverick-config = { workspace = true }
maverick-store = { workspace = true }
maverick-providers = { workspace = true }
maverick-runner = { workspace = true }
maverick-jobs = { workspace = true }
maverick-alerts = { workspace = true }
maverick-api = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
# serve: the HTTP/1.1 listeners with Go's header read timeout and a graceful drain.
axum = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "service", "tokio", "http1"] }
sqlx = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

[dev-dependencies]
maverick-bundle = { workspace = true, features = ["test-keys"] }
maverick-testdb = { workspace = true }
reqwest = { workspace = true }
