[package]
name = "maverick-jobs"
description = "graphile_worker jobs: the batches lease, the spend guard, batches, the rebuild chain, alerts, and catalog jobs. Postgres is the only queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
maverick-domain = { workspace = true }
maverick-config = { workspace = true }
maverick-store = { workspace = true }
maverick-runner = { workspace = true }
# The model listers of the `model_discovery` job (spec §4.6). Tests also use the fake
# provider, which answers the latency probes.
maverick-providers = { workspace = true }
maverick-alerts = { workspace = true }
chrono = { workspace = true }
graphile_worker = { workspace = true }
opentelemetry = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
maverick-testdb = { workspace = true }
parity-support = { path = "../parity-support" }
# Log capture with the secret-leak guard for the corpus gates (G7).
test-support = { path = "../test-support" }
# Builds sample strings from grader regexes for the corpus gates' autofail traps.
regex-syntax = "0.8"
