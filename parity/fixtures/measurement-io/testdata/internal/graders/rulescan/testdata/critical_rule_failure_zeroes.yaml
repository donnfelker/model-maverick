description: adversarial — a failed critical rule zeroes the dimension even though every other rule passes
spec:
  rules:
    - { must_include: WHERE, weight: 5 }
    - { must_include: LIMIT, weight: 5 }
    - { must_not_include: DELETE, critical: true, weight: 1 }
output: DELETE FROM users WHERE id = 1 LIMIT 1;
expect:
  dimensions: { constraint_compliance: 0.0 }
  detail_contains: ['"critical_failed":true', '"score":0']
