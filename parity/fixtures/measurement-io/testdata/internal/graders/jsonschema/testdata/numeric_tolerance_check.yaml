description: numeric check passes within tolerance, fails outside it
spec:
  schema:
    type: object
    required: [confidence, count]
    properties:
      confidence: { type: number }
      count: { type: integer }
  checks:
    - { path: $.confidence, numeric: 0.25, tolerance: 0.01 }
    - { path: $.count, numeric: 12, tolerance: 0 }
output: |-
  ```json
  { "confidence": 0.245, "count": 13 }
  ```
expect:
  dimensions: { schema_validity: 1.0, field_accuracy: 0.5 }
  detail_contains: ['"path":"$.count"']
