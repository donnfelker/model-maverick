[package]
name = "sdk-conformance"
description = "The SDK conformance harness: a mock engine and a mock provider, plus the frozen cross-language scenarios (twelve groups) and test vectors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "sdk_conformance"
path = "src/lib.rs"

[[bin]]
name = "sdk-conformance"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
maverick-core = { path = "../maverick-core" }
# The retention expiry and telemetry outcome vectors replay against the engine's rules.
maverick-domain = { workspace = true }
chrono = { workspace = true }
# conformance.json pins each frozen file by its sha256.
sha2 = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
