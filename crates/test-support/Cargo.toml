[package]
name = "test-support"
description = "Shared test observability for Model Maverick: per-test tracing capture with a G5 secret-leak guard, step logging, and readable parity diff and replay reporters. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# Integration tests under tests/ are separate crates, so they need tracing in scope to
# emit events through the installed capture layer and to exercise the `step!` macro.
tracing = { workspace = true }
