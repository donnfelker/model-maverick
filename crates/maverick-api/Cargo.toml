[package]
name = "maverick-api"
description = "The public and internal HTTP listeners (axum), all endpoints, and MCP (rmcp). Has no business logic: it calls services, which call domain and store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
maverick-domain = { workspace = true }
maverick-store = { workspace = true }
maverick-runner = { workspace = true }
maverick-alerts = { workspace = true }
maverick-config = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# W3C trace context for the request span (spec §14.3, D19).
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
futures-util = "0.3"
http-body-util = "0.1"
ulid = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
maverick-testdb = { workspace = true }
tracing-subscriber = { workspace = true }
# The in-memory span exporter for the request-span tests.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# Applies the real graphile_worker schema in the health tests.
graphile_worker = { workspace = true }
