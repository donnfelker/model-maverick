name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  tiers:
    name: ${{ matrix.tier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier:
          - fast
          - db
          - parity
          - e2e
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ matrix.tier }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-

      - name: Install fast-tier cargo tools
        if: matrix.tier == 'fast'
        # The cache restores ~/.cargo/bin without cargo's install metadata, so a plain
        # `cargo install` fails with "binary already exists". Skip a tool that is
        # already at the pinned version; otherwise reinstall over it.
        run: |
          if ! cargo deny --version 2>/dev/null | grep -qxF 'cargo-deny 0.20.2'; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
          if ! sqlx --version 2>/dev/null | grep -qxF 'sqlx-cli 0.9.0'; then
            cargo install sqlx-cli --version 0.9.0 --locked --force --no-default-features --features rustls,postgres
          fi

      - name: Run tier
        run: scripts/ci.sh "${{ matrix.tier }}"

      - name: Upload CI logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.tier }}-logs
          path: target/ci/${{ matrix.tier }}

  mutants:
    name: mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-mutants
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-

      - name: Install cargo-mutants
        # See the fast-tier install step: skip when the cached binary is already pinned.
        run: |
          if ! cargo mutants --version 2>/dev/null | grep -qxF 'cargo-mutants 27.1.0'; then
            cargo install cargo-mutants --version 27.1.0 --locked --force
          fi

      - name: Run mutants
        run: scripts/ci.sh mutants

      - name: Upload mutant logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-mutants-logs
          path: target/ci/mutants
