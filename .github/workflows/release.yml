name: Release

# One engine release (bead xq7v.21; spec §14.4 "Release artifacts"; docker/README.md
# "Releases").
#
# - A pushed tag `v<semver>` builds the artifacts with scripts/release-artifacts.sh. Then it
#   pushes both images to the GitHub container registry, and signs the images (by digest)
#   and every artifact with cosign keyless signing: the signing identity is this workflow's
#   GitHub OIDC token, so no key is stored anywhere. Last, it creates the GitHub release with
#   the artifacts, their Sigstore bundles, and SHA256SUMS.
# - A manual run is a dry run. It builds and checks the same artifacts and attaches them to
#   the run, unsigned. It pushes, signs, and publishes nothing.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    # The image CI pins (see ci.yml).
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write # the GitHub release
      packages: write # the images
      id-token: write # cosign keyless signing
    steps:
      - name: Free runner disk space
        # The same cleanup as ci.yml: the release build and two image tarballs need the room.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/az /opt/microsoft /opt/google
          docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Release version
        id: release
        # A tag names the version (the script checks that it equals the workspace version).
        # A dry run uses the workspace version.
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo metadata --no-deps --format-version 1 --offline |
              jq -r '.packages[] | select(.name == "maverick") | .version')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Install cargo tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Build the artifacts
        env:
          MAVERICK_RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: scripts/release-artifacts.sh "$VERSION" dist

      - name: Attach the dry run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ steps.release.outputs.version }}
          path: dist

      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Log in to the container registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and sign the images
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REGISTRY: ${{ steps.release.outputs.registry }}
        run: |
          : > "$RUNNER_TEMP/images"
          for image in maverick maverick-proxy; do
            docker tag "$image:$VERSION" "$REGISTRY/$image:$VERSION"
            docker push "$REGISTRY/$image:$VERSION"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$image:$VERSION")"
            cosign sign --yes "$digest"
            echo "$digest" >> "$RUNNER_TEMP/images"
          done

      - name: Sign the artifacts
        if: github.ref_type == 'tag'
        working-directory: dist
        run: |
          for file in *; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "Maverick engine $VERSION, built from $GITHUB_SHA."
            echo
            echo "Images (signed with cosign keyless signing):"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/images"
            echo
            echo "Verify an image or a file as docker/README.md \"Releases\" describes."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Maverick $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
