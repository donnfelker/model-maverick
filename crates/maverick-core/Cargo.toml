[package]
name = "maverick-core"
description = "The Rust copy of the shared SDK core: recommend client, chain executor, fail-open ladder, telemetry batcher, alias grammar, workload projection. The trial proxy depends on it by path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# D26: `Retry-After` as an HTTP date (already locked through hyper).
httpdate = "1"

[dev-dependencies]
insta = { workspace = true }
parity-support = { path = "../parity-support" }
# Paused time for Retry-After and header-timeout tests.
tokio = { workspace = true, features = ["test-util"] }
# Captures the chain executor's attempt log in tests.
tracing-subscriber = { workspace = true }
