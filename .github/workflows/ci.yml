name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The full mutation run (sharded) runs nightly and on demand; pushes run it on the
  # changed lines only. See the mutants jobs below.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Many agents push to main, often faster than the fast tier runs. On main a running run
# is never cancelled: it finishes, and GitHub keeps only the newest pending run behind it,
# so gates complete and the newest commit is tested next without a queue of stale runs.
# A pull request's newer push cancels its older run. The event name keeps a push from
# touching the nightly run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Disk (bead model-maverick-vjt): every job first removes the SDKs and Docker images this
# project never uses. The cargo cache holds dependencies only. The old cache restored the
# whole `target` (28 to 29 GB of test binaries) before the build began, and the fast tier
# ran out of disk pulling postgres:16-alpine for testcontainers.
env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # The full debug build of the workspace (plus the restored cache) filled the runner
  # disk: "No space left on device" at link time. Line tables keep file:line backtraces
  # at a fraction of the size, and incremental artifacts are useless on a fresh runner.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  tiers:
    name: ${{ matrix.tier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier:
          - fast
          - db
          - parity
          - e2e
    steps:
      - name: Free runner disk space
        # ubuntu-latest ships about 45 GB of SDKs and Docker images this project never
        # uses. Rust comes from rustup in the home directory, not the hosted tool cache,
        # and the tests pull their own postgres image.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/az /opt/microsoft /opt/google
          docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        # Dependencies, the registry, and ~/.cargo/bin only. The action removes the
        # workspace crates' artifacts before it saves, so the restore is a few GB and the
        # disk is left for this run's build.
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.tier }}

      - name: Install fast-tier cargo tools
        if: matrix.tier == 'fast'
        # The cache restores ~/.cargo/bin. Skip a tool that is already at the pinned
        # version; otherwise reinstall over it (a binary without cargo's install
        # metadata makes a plain `cargo install` fail with "binary already exists").
        run: |
          if ! cargo deny --version 2>/dev/null | grep -qxF 'cargo-deny 0.20.2'; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
          if ! sqlx --version 2>/dev/null | grep -qxF 'sqlx-cli 0.9.0'; then
            cargo install sqlx-cli --version 0.9.0 --locked --force --no-default-features --features rustls,postgres
          fi

      - name: Run tier
        run: scripts/ci.sh "${{ matrix.tier }}"

      - name: Disk usage
        if: always()
        run: df -h / && (du -sh target 2>/dev/null || true)

      - name: Upload CI logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.tier }}-logs
          path: target/ci/${{ matrix.tier }}

  # cargo-mutants on maverick-domain is about 1,900 mutants, several hours on one runner
  # (past the 6-hour job limit), and pushes arrive every few minutes. So each push and
  # pull request tests the mutants on its changed lines, and the full run is split into
  # shards nightly and on demand.
  mutants-diff:
    name: mutants (changed lines)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space
        # cargo-mutants builds a second copy of the workspace, so disk matters here too.
        # See the tiers job for the list.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/az /opt/microsoft /opt/google
          docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        # Dependencies only (see the tiers job). The shared key replaces the job id, so
        # the nightly shards restore this cache too.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants

      - name: Install cargo-mutants
        # See the fast-tier install step: skip when the cached binary is already pinned.
        run: |
          if ! cargo mutants --version 2>/dev/null | grep -qxF 'cargo-mutants 27.1.0'; then
            cargo install cargo-mutants --version 27.1.0 --locked --force
          fi

      - name: Run mutants on changed lines
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # A new branch has no "before" commit; fall back to the parent.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi
          scripts/ci.sh mutants-diff "$base"

      - name: Disk usage
        if: always()
        run: df -h / && (du -sh target 2>/dev/null || true)

      - name: Upload mutant logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-mutants-diff-logs
          path: target/ci/mutants

  mutants-full:
    name: mutants (shard ${{ matrix.shard }}/8)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Free runner disk space
        # See the tiers job for the list.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/az /opt/microsoft /opt/google
          docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        # Dependencies only (see the tiers job). The shards share the mutants-diff cache,
        # and one shard saves it.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
          save-if: ${{ matrix.shard == 0 }}

      - name: Install cargo-mutants
        run: |
          if ! cargo mutants --version 2>/dev/null | grep -qxF 'cargo-mutants 27.1.0'; then
            cargo install cargo-mutants --version 27.1.0 --locked --force
          fi

      - name: Run mutants shard
        run: scripts/ci.sh mutants "${{ matrix.shard }}/8"

      - name: Disk usage
        if: always()
        run: df -h / && (du -sh target 2>/dev/null || true)

      - name: Upload mutant logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-mutants-shard-${{ matrix.shard }}-logs
          path: target/ci/mutants
