[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

# Vulnerabilities and unsound advisories are denied by default in cargo-deny 0.20;
# there is no per-severity toggle to set. We only tune the extras below.
[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# Scoped, per-crate license grants. webpki-roots ships Mozilla's CA certificate
# bundle (required by the rustls stack) under CDLA-Permissive-2.0, a permissive,
# non-copyleft data license. We accept it only for that crate, not globally.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

# Our own workspace crates are `publish = false` and carry `license = "UNLICENSED"`.
# Skip them here: the allow-list above governs third-party dependencies, which is what
# keeps a later permissive open-source license choice possible (bead pkg1.2 gate 4).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Deny external wildcard version requirements, but allow them for internal path deps:
# the engine crates are declared in [workspace.dependencies] as path deps and consumed
# with `{ workspace = true }`, which resolves to a `*` requirement inside the workspace.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "native-tls", reason = "TLS must use rustls." },
    { crate = "openssl", reason = "OpenSSL is not allowed in this workspace." },
    { crate = "openssl-sys", reason = "OpenSSL is not allowed in this workspace." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
